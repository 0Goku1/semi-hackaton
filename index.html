<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지도</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="index-page">
    <div id="phone-frame">
      <div id="map"></div>

      <!-- 초기 지도 로딩 스플래시 -->
      <div id="app-splash">
        <div class="splash-icon">🔥</div>
        <div class="spinner"></div>
        <p class="splash-text">산불 위험 구역 확인 중...</p>
      </div>

      <!-- 우측 상단 원형 미니 프로필 -->
      <div id="profile-area">
        <button
          id="profile-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="프로필 메뉴 열기"
        >
          <img
            id="profile-avatar"
            src="https://api.dicebear.com/7.x/initials/svg?seed=승우&backgroundColor=FF6F00"
            alt="내 프로필"
          />
        </button>

        <!-- 프로필 드롭다운 메뉴 -->
        <div id="profile-menu" class="hidden" role="menu">
          <div class="profile-menu-header">
            <img
              class="profile-menu-avatar"
              src="https://api.dicebear.com/7.x/initials/svg?seed=승우&backgroundColor=FF6F00"
              alt=""
            />
            <div class="profile-menu-info">
              <strong class="profile-menu-name">정승우</strong>
              <span class="profile-menu-role">화성시 산불감시원</span>
            </div>
          </div>

          <a href="myPage.html" class="profile-menu-item" role="menuitem">내 정보</a>

          <a href="notifications.html" class="profile-menu-item" role="menuitem">알림</a>

          <a href="my-reports.html" class="profile-menu-item" role="menuitem">순찰 기록 보고서</a>

          <a href="login.html" id="logout-btn" class="profile-menu-item profile-menu-item--danger" role="menuitem">로그아웃</a>
        </div>
      </div>

      <!-- 로딩 오버레이 -->
      <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p class="loading-text">최적 동선 계산 중...</p>
      </div>

      <!-- 하단 컨트롤 패널 -->
      <div id="bottom-panel">
        <h2 id="panel-title">순찰 대기 상태</h2>
        <button id="action-btn" class="panel-btn btn-primary">동선 찾기</button>
      </div>
    </div>

    <script src="js/secrets.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dummyData.js?v=2"></script>
    <script src="js/patrolRoute.js"></script>
    <script src="js/mapMarkers.js?v=2"></script>
    <script>
      const kakaoScript = document.createElement("script");
      kakaoScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        SECRETS.KAKAO_JS_KEY +
        "&autoload=false";
      kakaoScript.onload = function () {
        const appScript = document.createElement("script");
        appScript.src = "js/app.js";
        document.body.appendChild(appScript);
      };
      kakaoScript.onerror = function () {
        const appScript = document.createElement("script");
        appScript.src = "js/app.js";
        document.body.appendChild(appScript);
      };
      document.head.appendChild(kakaoScript);
    </script>
  </body>
</html>
