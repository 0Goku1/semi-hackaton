<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코리요 지킴이 - 순찰 기록</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/subPage.css" />
  </head>
  <body class="index-page">
    <div id="phone-frame" style="background-color: #f5f6f8;">
      <div class="card-wrapper">
        
        <div class="page-header">
          <h2>순찰 기록 보고서</h2>
          <p>내가 작성한 실시간 완료 내역</p>
        </div>

        <div class="report-list" id="dynamic-report-list">
          </div>

        <div class="back-btn-area">
          <button type="button" class="panel-btn btn-primary" onclick="window.location.href='index.html';" style="width: 100%; height: 48px; padding: 0; font-size: 15px; border-radius: 12px; background-color: var(--text-sub);">
            지도 화면으로 가기
          </button>
        </div>

      </div>
    </div>

    <script src="js/secrets.js"></script>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (!ApiClient.requireAuthPage()) return;

        const reportListContainer = document.getElementById("dynamic-report-list");
        reportListContainer.innerHTML =
          '<div style="text-align:center;color:#868e96;padding:40px 0;font-size:14px;">불러오는 중...</div>';

        try {
          const myFilteredReports = await ApiClient.listMyReports();

          if (!myFilteredReports.length) {
            reportListContainer.innerHTML = `
              <div style="text-align: center; color: #868e96; padding: 60px 0; font-size: 14px; line-height: 1.6;">
                아직 등록된 순찰 기록이 없습니다.<br>첫 순찰 활동을 마친 후 등록해 보세요!
              </div>
            `;
            return;
          }

          reportListContainer.innerHTML = myFilteredReports
            .map((report) => {
              const badgeClass =
                report.status === "이상 발견" ? "status-alert" : "status-success";
              return `
            <div class="report-card" onclick="alert('보고서 상세조회 기능은 준비 중입니다.');">
              <div class="report-top">
                <span class="report-date">${report.date}</span>
                <span class="status-badge ${badgeClass}">${report.status}</span>
              </div>
              <div class="report-mid">
                <div>순찰 구역: <span class="user-gu-txt">${report.zone}</span></div>
                <div>소요 시간: <span>${report.time}</span></div>
                <div style="font-size: 11px; color: #ff6f00; margin-top: 3px; font-weight: 500;">기상 위험 환경: ${report.weather}</div>
              </div>
              <div class="report-bottom">보고: ${report.notes}</div>
            </div>
          `;
            })
            .join("");
        } catch (err) {
          reportListContainer.innerHTML = `
            <div style="text-align: center; color: #e03131; padding: 60px 0; font-size: 14px;">
              ${err.message || "기록을 불러오지 못했습니다."}
            </div>
          `;
        }
      });
    </script>
  </body>
</html>
