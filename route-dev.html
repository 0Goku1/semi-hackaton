<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>동선 레이어 DEV — 화성시 산불감시</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/route-dev.css" />
</head>
<body class="index-page">
  <div id="phone-frame">
    <div id="map"></div>

    <div id="route-dev-splash">
      <div class="route-dev-spinner"></div>
      <p class="route-dev-splash-text">화성시 전 구역 격자 로딩…</p>
    </div>

    <div id="loading-overlay" class="hidden">
      <div class="spinner"></div>
      <p class="loading-text">TOP 동선 배정 중…</p>
    </div>

    <header class="route-dev-header">
      <div class="route-dev-header-row">
        <button class="btn-back-header" type="button" onclick="window.location.href='index.html'" aria-label="뒤로">‹</button>
        <div>
          <div class="route-dev-title">동선 레이어 <span class="dev-badge">DEV</span></div>
          <div class="route-dev-sub" id="net-meta">네트워크 준비 중</div>
        </div>
      </div>
    </header>

    <aside id="rank-panel" aria-label="위험 등급 순위">
      <div class="rank-panel-head">
        <strong>위험 순위</strong>
        <span>JSON</span>
      </div>
      <ul id="rank-list"></ul>
      <button type="button" class="rank-panel-more" id="btn-open-detail">전체 보기</button>
    </aside>

    <!-- 레이어 토글: 농경지·등산로 등 포커스 -->
    <aside id="layer-panel" aria-label="지도 레이어">
      <div class="layer-panel-head">
        <strong>레이어</strong>
        <button type="button" class="layer-fit-btn" id="btn-fit-city" title="화성시 전체 보기">시 전체</button>
      </div>
      <ul class="layer-list">
        <li>
          <label class="layer-item">
            <input type="checkbox" id="layer-city" checked />
            <span class="layer-swatch layer-swatch-city"></span>
            <span>시 전체 격자</span>
          </label>
        </li>
        <li>
          <label class="layer-item">
            <input type="checkbox" id="layer-farm" checked />
            <span class="layer-swatch layer-swatch-farm"></span>
            <span>농경지 격자</span>
            <span class="layer-tag">HsFram</span>
          </label>
        </li>
        <li>
          <label class="layer-item">
            <input type="checkbox" id="layer-risk" checked />
            <span class="layer-swatch layer-swatch-risk"></span>
            <span>위험격자</span>
            <span class="layer-tag">JSON</span>
          </label>
        </li>
        <li>
          <label class="layer-item">
            <input type="checkbox" id="layer-trails" checked />
            <span class="layer-swatch layer-swatch-trail"></span>
            <span>등산로</span>
          </label>
        </li>
        <li>
          <label class="layer-item">
            <input type="checkbox" id="layer-roads" checked />
            <span class="layer-swatch layer-swatch-road"></span>
            <span>임도</span>
          </label>
        </li>
        <li>
          <label class="layer-item layer-item--soon">
            <input type="checkbox" id="layer-spring" disabled />
            <span class="layer-swatch layer-swatch-spring"></span>
            <span>약수터</span>
            <span class="layer-tag layer-tag-soon">추가 예정</span>
          </label>
        </li>
      </ul>
      <p class="layer-hint" id="layer-hint">위험=risk_grids · 농경지=HsFram · 약수터 대기</p>
    </aside>

    <div id="bottom-panel">
      <h2 id="panel-title">전체 격자 로딩 중…</h2>
      <!-- DEV-START-POS: 제거 시 칩·버튼·routeDevStartPos*.js·CSS 블록 삭제 -->
      <div id="dev-start-status" class="dev-start-status is-gps" aria-live="polite">배정 시작 · 내 위치</div>
      <div class="dev-btn-row">
        <button id="btn-officers" class="panel-btn btn-ghost" type="button">요원</button>
        <button id="btn-dev-start-pos" class="panel-btn btn-ghost btn-dev-start-pos" type="button">시청으로 이동</button>
        <button id="action-btn" class="panel-btn btn-primary" type="button">동선 찾기</button>
      </div>
      <button id="btn-start-patrol" class="panel-btn btn-success hidden" type="button">순찰 시작</button>
    </div>

    <div id="sheet-backdrop"></div>

    <section id="officer-sheet" aria-hidden="true">
      <div class="detail-handle"></div>
      <div class="detail-head">
        <h3>순찰 요원</h3>
        <button type="button" class="detail-close" id="btn-close-officers" aria-label="닫기">×</button>
      </div>
      <p class="officer-source-hint" id="officer-source-hint">요원 총 —명</p>
      <div class="officer-toolbar">
        <span id="officer-summary" class="hidden" aria-hidden="true"></span>
        <button type="button" class="officer-filter" id="btn-officer-filter" data-mode="all">전체</button>
      </div>
      <ul id="officer-list"></ul>
      <form id="officer-add-form" class="officer-add" autocomplete="off">
        <input type="text" id="officer-add-name" placeholder="이름 추가" maxlength="40" required />
        <label class="officer-add-avail">
          <input type="checkbox" id="officer-add-available" checked />
          가용
        </label>
        <button type="submit" class="officer-add-btn">추가</button>
      </form>
    </section>

    <section id="grid-info-sheet" aria-hidden="true">
      <div class="detail-handle"></div>
      <div class="detail-head">
        <h3>격자 정보</h3>
        <button type="button" class="detail-close" id="btn-close-grid-info" aria-label="닫기">×</button>
      </div>
      <div id="grid-info-body" class="grid-info-body"></div>
    </section>

    <section id="detail-sheet" aria-hidden="true">
      <div class="detail-handle"></div>
      <div class="detail-head">
        <h3>위험 격자 JSON</h3>
        <button type="button" class="detail-close" id="btn-close-detail" aria-label="닫기">×</button>
      </div>
      <ul id="detail-list"></ul>
    </section>
  </div>

  <script src="js/secrets.js"></script>
  <script src="js/mapMarkers.js"></script>
  <script src="js/patrolApi.js"></script>
  <script src="js/routeDevStartPos.js"></script>
  <script src="js/routeDevStartPosBind.js"></script>
  <script src="js/routeDevData.js"></script>
  <script src="js/routeDevGridLayer.js"></script>
  <script>
    const kakaoScript = document.createElement("script");
    kakaoScript.src =
      "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
      SECRETS.KAKAO_JS_KEY +
      "&autoload=false";
    kakaoScript.onload = function () {
      const s = document.createElement("script");
      s.src = "js/route-dev.js";
      document.body.appendChild(s);
    };
    kakaoScript.onerror = function () {
      const t = document.querySelector(".route-dev-splash-text");
      if (t) t.textContent = "카카오맵 로드 실패 — secrets.js 확인";
    };
    document.head.appendChild(kakaoScript);
  </script>
</body>
</html>
