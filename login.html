<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코리요 지킴이 - 로그인</title>
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="report-body">

    <div class="mobile-container">
        <div class="logo-area">
            <div class="logo-image-box">
                <img src="koriyo-logo.jpg" alt="코리요 지킴이 로고" class="main-logo-img">
            </div>
            <h2 class="logo-title" style="font-size: 20px;">
                <span class="orange-txt">지킴이</span> 로그인
            </h2>
        </div>

        <form class="login-form" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <input type="text" id="login-id" placeholder="아이디 입력" required>
            </div>
            
            <div class="input-group" style="position: relative;">
                <input type="password" id="login-pw" placeholder="비밀번호 입력" required style="padding-right: 45px;">
                <button type="button" onclick="togglePasswordVisibility('login-pw', this)" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; z-index: 10; display: flex; align-items: center; justify-content: center;">
                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-login">로그인</button>
        </form>

        <div class="signup-links">
            <span style="font-size: 14px; color: #666666;">아직 계정이 없으신가요? </span>
            <a href="signup.html" style="color: var(--koriyo-orange); margin-left: 8px; font-weight: bold; text-decoration: none;">회원가입하기</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
