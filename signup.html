<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코리요 지킴이 - 회원가입</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="report-body">

    <div id="phone-frame">
    <div class="mobile-container">
        <div class="logo-area">
            <div class="logo-image-box">
                <img src="koriyo-logo.jpg" alt="코리요 지킴이 로고" class="main-logo-img">
            </div>
            <h2 class="logo-title" style="font-size: 20px;">
                <span class="orange-txt">지킴이</span> 회원가입
            </h2>
        </div>

        <form class="login-form" onsubmit="return handleSignup(event)">
            <div class="input-group">
                <input type="text" id="user_name" placeholder="사용자 성명 입력" required>
            </div>
            
            <div class="input-group">
                <input type="text" id="signup-id" placeholder="아이디 (4~20자, 영문·숫자·_)" required>
            </div>
            
            <div class="input-group" style="position: relative;">
                <input type="password" id="signup-pw" placeholder="비밀번호 (8~64자, 영문+숫자 포함)" required style="padding-right: 45px;">
                <button type="button" onclick="togglePasswordVisibility('signup-pw', this)" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; z-index: 10; display: flex; align-items: center; justify-content: center;">
                    <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
            
            <div class="input-group">
                <select id="signup-gu" onchange="updateDongOptions()" required class="select-box">
                    <option value="" disabled selected>관리 구청 선택</option>
                    <option value="효행구">효행구</option>
                    <option value="병점구">병점구</option>
                    <option value="만세구">만세구</option>
                    <option value="동탄구">동탄구</option>
                </select>
            </div>

            <div class="input-group">
                <select id="signup-region" required class="select-box">
                    <option value="" disabled selected>세부 관리지역(읍·면·동) 선택</option>
                </select>
            </div>

            <div class="input-group">
                <select id="signup-role" required class="select-box">
                    <option value="" disabled selected>계정 역할 선택</option>
                    <option value="officer">순찰 요원 (officer)</option>
                    <option value="dev">개발자 / 관리 테스트 (dev)</option>
                </select>
            </div>
            <p style="font-size: 12px; color: #888; margin: -8px 0 16px; line-height: 1.4;">
                개발 중 필요한 본인 테스트 계정은 <strong>dev</strong> 로 가입하시오.
                시드 요원 아이디(<code>officer01</code>~)는 사용할 수 없습니다.
            </p>

            <div id="signup-status" class="signup-status" hidden role="status" aria-live="polite"></div>

            <button type="submit" class="btn-login" id="signup-submit-btn">가입하기</button>
        </form>

        <div class="signup-links">
            <span style="font-size: 14px; color: #666666;">이미 계정이 있으신가요? </span>
            <a href="login.html" style="color: var(--koriyo-orange); margin-left: 8px; font-weight: bold; text-decoration: none;">로그인하기</a>
        </div>
    </div>
    </div>

    <script src="js/secrets.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
